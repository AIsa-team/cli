# CI — runs on every push and PR. Does NOT publish.
#
# Matrix: 18/20 legacy compatibility, 22/24 maintained, 26 current.
# engines stay >=18. Ubuntu only; no extra OS coverage.
#
# Isolated pack checks: `node scripts/package-smoke.mjs`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Isolated package smoke
        run: node scripts/package-smoke.mjs
