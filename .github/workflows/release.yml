# Release — publish to npm when a v* tag is pushed.
#
# The tag is the publish button. `git push origin v0.5.0` triggers this;
# a push to main runs CI only.
#
# npm Trusted Publisher must be configured for repository AIsa-team/cli and
# workflow release.yml before a tag can publish. This workflow has not
# recorded a successful OIDC publish. Until that setup exists, `npm publish`
# 403s and the tag is harmless. Do not add NODE_AUTH_TOKEN or change these
# permissions.
#
# The job publishes the smoke-tested tarball, not a second pack of the
# source tree. A tag that does not match package.json is refused.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write        # required for Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Publish on maintained Node 24. engines stay >=18.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg — refusing to publish"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      # npm 11.6.0 is >= 11.5.1 (OIDC) and supports Node 24. Do not use latest.
      - run: npm install -g npm@11.6.0
      - run: npm ci
      - run: npm test
      - name: Pack and smoke the release tarball
        run: node scripts/package-smoke.mjs --output "$RUNNER_TEMP/aisa-cli-release"
      - name: Publish the smoke-tested tarball
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tarball="$RUNNER_TEMP/aisa-cli-release/artifacts/aisa-one-cli-${pkg}.tgz"
          if [ ! -f "$tarball" ]; then
            echo "::error::smoke tarball missing: $tarball"
            exit 1
          fi
          npm publish "$tarball"
