# Release — publish to npm when a v* tag is pushed.
#
# The whole point: the tag IS the publish button. `git push origin v0.4.0`
# triggers this, and nothing else does. A plain push to main only runs CI
# (ci.yml); it never publishes.
#
# Auth is Trusted Publishing (OIDC): GitHub proves to npm that this workflow,
# in this repo, is running — no token is stored anywhere, so there is no token
# to leak and no 90-day rotation. Account 2FA stays ON and is never in the way,
# because OIDC is not a "token that bypasses 2FA".
#
# Trusted Publisher on npmjs.com is a publish-time prerequisite, not something
# this repository has proven. `gh run list --workflow release.yml` returns
# no historical runs and no historical release.yml success, so OIDC publish
# must not be treated as already verified.
# Before the first tag that should ship: a maintainer configures
# @aisa-one/cli → Settings → Trusted Publisher for repository AIsa-team/cli
# and workflow release.yml. Until that exists, `npm publish` 403s and the
# tag is harmless. Do not add NODE_AUTH_TOKEN or change these permissions
# to "make it work".
#
# A guard refuses to publish if the tag and package.json disagree, so a
# mistyped tag can never ship a version the code does not claim.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write        # required for Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Publish on maintained Node 24. engines stay >=18.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg — refusing to publish"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      # Trusted Publishing needs npm >= 11.5.1 for the OIDC handshake.
      # Install latest npm rather than depending on the image default.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: node scripts/package-smoke.mjs

      # `prepack` builds the tarball. Do not also run `npm run build` here —
      # that would duplicate the lifecycle. npm does the OIDC handshake itself;
      # no NODE_AUTH_TOKEN, no stored secret.
      - name: Publish to npm (Trusted Publishing)
        run: npm publish
